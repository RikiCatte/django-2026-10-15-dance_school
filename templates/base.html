{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="{% static 'css/style.css' %}" rel="stylesheet" />
    <title>{% block title %}Dance School{% endblock %}</title>
    <script src="{% static 'js/toggle-modal.js' %}" defer></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  </head>
  <body>
    {% include "components/navbar.html" %}
    <section id="registrati">
      <button type="button" class="close-registrati" onclick="chiudiRegistrati()" aria-label="Chiudi">×</button>
      <form>
          <p>
              <label for="registrati-nome">Nome</label>
              <input type="text" name="nome" id="registrati-nome">
          </p>
          <p>
              <label for="registrati-cognome">Cognome</label>
              <input type="text" name="cognome" id="registrati-cognome">
          </p>
          <p>
              <label for="registrati-email">Email</label>
              <input type="email" name="email" id="registrati-email">
          </p>
          <p>
              <button type="submit">Invia</button>
          </p>
      </form>
    </section>
    <main>{% block content %} {% endblock %}</main>
    <footer>
      <address>Via F. Tamburini 96, Modena, 41124</address>
      <p>Telefono: +39 545454</p>
      <p>
        Email: <a href="mailto:email@dance-school.com">email@dance-school.com</a>
      </p>
    </footer>
  </body>
</html>
